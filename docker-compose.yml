services:
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_ROOT_HOST: "%"
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 10

    server1:
        &server_base
        build:
            context: ./server
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            APP_BASE_URL: ${APP_BASE_URL}
            APP_PRIMARY_DOMAIN: ${APP_PRIMARY_DOMAIN}
            ENABLE_HTTPS: ${ENABLE_HTTPS}
            DOMAINS: ${DOMAINS}
            JWT_SECRET: ${JWT_SECRET}
            ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY}
            DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
            MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT}
            EMAIL_PROVIDER: ${EMAIL_PROVIDER}
            EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET}
            EMAIL_CODE_TTL_SECONDS: ${EMAIL_CODE_TTL_SECONDS}
            EMAIL_CODE_COOLDOWN_SECONDS: ${EMAIL_CODE_COOLDOWN_SECONDS}
            EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME}
            EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
            EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
            EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE}
            EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
            EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS}
            EMAIL_FROM: ${EMAIL_FROM}
            EMAIL_SMTP_REJECT_UNAUTHORIZED: ${EMAIL_SMTP_REJECT_UNAUTHORIZED}
            EMAIL_SMTP_TIMEOUT_MS: ${EMAIL_SMTP_TIMEOUT_MS}
            UPLOAD_DIR: ${UPLOAD_DIR}
            UPLOAD_PUBLIC_PREFIX: ${UPLOAD_PUBLIC_PREFIX}
        volumes:
            - server_uploads:/app/uploads
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10

    server2:
        <<: *server_base

    frontend:
        build:
            context: ./client
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10

    nginx:
        build:
            context: .
            dockerfile: deploy/nginx/Dockerfile
        restart: unless-stopped
        environment:
            ENABLE_HTTPS: ${ENABLE_HTTPS}
            DOMAINS: ${DOMAINS}
            NGINX_CLIENT_MAX_BODY_SIZE: ${UPLOAD_MAX_BODY_SIZE}
            UPLOAD_PUBLIC_PREFIX: ${UPLOAD_PUBLIC_PREFIX}
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - certbot_www:/var/www/certbot
            - letsencrypt:/etc/letsencrypt
        depends_on:
            frontend:
                condition: service_healthy
            server1:
                condition: service_healthy
            server2:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok || exit 1"]
            interval: 20s
            timeout: 5s
            retries: 10

    certbot:
        image: certbot/certbot:latest
        restart: unless-stopped
        environment:
            ENABLE_HTTPS: ${ENABLE_HTTPS}
            DOMAINS: ${DOMAINS}
            LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
            LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING}
        entrypoint: ["/bin/sh", "/opt/certbot/entrypoint.sh"]
        volumes:
            - certbot_www:/var/www/certbot
            - letsencrypt:/etc/letsencrypt
            - ./deploy/certbot/entrypoint.sh:/opt/certbot/entrypoint.sh:ro
        depends_on:
            nginx:
                condition: service_started

volumes:
    mysql_data:
    server_uploads:
    certbot_www:
    letsencrypt:
